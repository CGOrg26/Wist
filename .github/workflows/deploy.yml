name: 🚀 Deploy Wist Game to Server

on:
  push:
    branches:
      - main
      - master
      - deploy
      - deploy-server
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Wist to Production Server
    runs-on: [self-hosted, linux]  # Use org runner with linux label

    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4

      - name: 🛑 Stop running services
        run: |
          echo "Stopping Wist services..."
          pm2 stop wist-server wist-client 2>/dev/null || true
          sleep 2
        continue-on-error: true

      - name: 📥 Pull latest code from repository
        run: |
          echo "Pulling latest code from deploy-server branch..."
          git fetch origin deploy-server
          git reset --hard origin/deploy-server
          echo "✅ Code pulled successfully"

      - name: 📦 Install Node.js dependencies
        run: |
          echo "Installing server dependencies..."
          cd server
          npm install --production
          cd ..
          
          echo "Installing client dependencies..."
          cd client
          npm install
          npm run build
          cd ..
          echo "✅ Dependencies installed and built"

      - name: 🚀 Start services with PM2
        run: |
          echo "Starting Wist services..."
          
          pm2 start server/index.js --name "wist-server" --watch || pm2 restart "wist-server"
          pm2 start "serve -s client/dist -l 3000" --name "wist-client" || pm2 restart "wist-client"
          
          echo "Saving PM2 configuration..."
          pm2 save
          
          echo "✅ Services started successfully"

      - name: ✅ Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 5
          
          echo "Checking service status..."
          pm2 status
          
          echo "✅ Deployment completed successfully!"
