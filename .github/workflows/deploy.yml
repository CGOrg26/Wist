name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
      - deploy
      - deploy-server
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: self-hosted  # Uses your server's runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop services
        run: |
          pm2 stop wist-server wist-client 2>/dev/null || true
        continue-on-error: true

      - name: Pull latest code
        run: |
          git pull origin deploy

      - name: Install dependencies
        run: |
          cd server && npm install --production && cd ..
          cd client && npm install && npm run build && cd ..

      - name: Start services
        run: |
          pm2 start server/index.js --name "wist-server" --watch || pm2 restart "wist-server"
          pm2 start "serve -s client/dist -l 3000" --name "wist-client" || pm2 restart "wist-client"
          pm2 save

      - name: Verify deployment
        run: |
          sleep 5
          pm2 status
