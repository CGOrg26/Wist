services:
  # Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wist-server
    environment:
      - NODE_ENV=production
      - CLIENT_URL=http://10.2.146.151:3000
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - wist-network
    restart: unless-stopped

  # Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wist-client
    environment:
      - VITE_API_URL=http://10.2.146.151:5000
    ports:
      - "3000:3000"
    networks:
      - wist-network
    restart: unless-stopped
    depends_on:
      - server

networks:
  wist-network:
    driver: bridge
